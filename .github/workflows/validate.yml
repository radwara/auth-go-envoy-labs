name: Validate lab
on: [push, pull_request]
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
      - run: docker compose config --quiet
      - run: make validate-envoy
      - run: make up
      - run: make smoke
      - run: make smoke-tls
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: make down
