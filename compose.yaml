x-go: &go
  image: auth-go-envoy-labs:local
  build: .
  init: true

x-decision: &decision
  <<: *go
  command: ["/app/decision"]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: authz
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/schema.sql:/docker-entrypoint-initdb.d/001-policies.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "lab", "-d", "authz"]
      interval: 2s
      timeout: 2s
      retries: 15

  control:
    <<: *go
    command: ["/app/control"]
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/authz?sslmode=disable
      DECISION_TARGET: envoy:9090
    depends_on:
      postgres:
        condition: service_healthy

  decision-a:
    <<: *decision
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/authz?sslmode=disable
      REPLICA: decision-a

  decision-b:
    <<: *decision
    environment:
      DATABASE_URL: postgres://lab:lab@postgres:5432/authz?sslmode=disable
      REPLICA: decision-b

  jobs:
    <<: *go
    command: ["/app/jobs"]
    environment:
      DECISION_TARGET: envoy:9090
    stop_grace_period: 25s

  envoy:
    image: envoyproxy/envoy:v1.38.9
    init: true
    volumes:
      - ./deploy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9901:9901"

volumes:
  postgres-data:
