static_resources:
  listeners:
    - name: tls
      address:
        socket_address: {address: 0.0.0.0, port_value: 8443}
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              common_tls_context:
                tls_certificates:
                  - certificate_chain: {filename: /certs/server.crt}
                    private_key: {filename: /certs/server.key}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: tls
                route_config: &routes
                  name: lab_routes
                  virtual_hosts:
                    - name: lab
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route: {cluster: rest_envoy, timeout: 4s}
                http_filters: &filters
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
    - name: mtls
      address:
        socket_address: {address: 0.0.0.0, port_value: 8444}
      filter_chains:
        - transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
              require_client_certificate: true
              common_tls_context:
                tls_certificates:
                  - certificate_chain: {filename: /certs/server.crt}
                    private_key: {filename: /certs/server.key}
                validation_context:
                  trusted_ca: {filename: /certs/ca.crt}
          filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: mtls
                route_config: *routes
                http_filters: *filters
  clusters:
    - name: rest_envoy
      type: STRICT_DNS
      connect_timeout: 0.25s
      load_assignment:
        cluster_name: rest_envoy
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: envoy, port_value: 8080}
