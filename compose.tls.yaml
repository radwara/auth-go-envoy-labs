services:
  tls-envoy:
    image: envoyproxy/envoy:v1.38.9
    user: "${TLS_UID:?set TLS_UID}:${TLS_GID:?set TLS_GID}"
    depends_on:
      - envoy
    volumes:
      - ./deploy/envoy-tls.yaml:/etc/envoy/envoy.yaml:ro
      - "${TLS_CERT_DIR:?set TLS_CERT_DIR}/server.crt:/certs/server.crt:ro"
      - "${TLS_CERT_DIR}/server.key:/certs/server.key:ro"
      - "${TLS_CERT_DIR}/ca.crt:/certs/ca.crt:ro"
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8444:8444"
